server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - AuthenticationFilter
        - id: pet-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/pets/**, /api/v1/owners/**, /api/v1/medical-records/**, /api/v1/spa-tickets/**
          filters:
            - AuthenticationFilter

