server:
  port: 8080
  # Kubernetes sends SIGTERM on every rollout and scale-in: stop taking new requests,
  # finish the in-flight ones, then exit (timeout set in k8s/base/config.yaml)
  shutdown: graceful

# /actuator/health/liveness and /actuator/health/readiness, used by the Kubernetes probes
# (k8s/base/apps/*.yaml). Only the health endpoint is exposed over HTTP, without details.
management:
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      # Applied to every route: strips client-sent X-User-* headers and validates the JWT
      default-filters:
        - AuthenticationFilter
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: pet-service
          uri: ${PET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/pets/**, /api/v1/owners/**, /api/v1/appointments/**, /api/v1/boarding/**, /api/v1/spa-tickets/**
        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/analytics/**

jwt:
  # Same value as auth-service; no default on purpose (see auth-service application.yml)
  secret: ${JWT_SECRET}
