name: CI — pet-service

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'pet-service/**'
      - 'proto-common/**'
      - '.github/workflows/ci-pet-service.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'pet-service/**'
      - 'proto-common/**'
      - '.github/workflows/ci-pet-service.yml'

jobs:
  build:
    name: Build & Test pet-service
    runs-on: ubuntu-latest

    # No service containers: the integration tests start their own PostgreSQL
    # (zonky embedded binaries) and Kafka (spring-kafka-test, in the JVM).
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # proto-common phải được install vào local Maven cache trước
      - name: Build & install proto-common
        working-directory: proto-common
        run: mvn install -DskipTests -B

      - name: Make mvnw executable
        working-directory: pet-service
        run: chmod +x mvnw

      - name: Build & Test
        working-directory: pet-service
        run: ./mvnw verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-service-test-reports
          path: pet-service/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
