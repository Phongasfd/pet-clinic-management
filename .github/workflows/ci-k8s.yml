name: CI — kubernetes

# validate: renders both kustomize overlays and checks every object against the Kubernetes
#           1.31 API schemas (typos, wrong fields, wrong types), in seconds.
# e2e:      builds the five images, deploys them to a throwaway kind cluster and runs
#           k8s/scripts/smoke-test.sh: gateway -> services -> gRPC/Kafka -> databases,
#           NetworkPolicy and the CronJob, i.e. the cross-service test the unit/integration
#           suites cannot do.
on:
  workflow_dispatch:
  push:
    # feat/fix branches too: the deployment can be checked before a pull request exists
    branches: [ main, master, develop, 'feat/**', 'fix/**' ]
    paths:
      - 'k8s/**'
      - '**/Dockerfile'
      - '**/pom.xml'
      - '**/src/main/**'
      - 'proto-common/**'
      - '.github/workflows/ci-k8s.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'k8s/**'
      - '**/Dockerfile'
      - '**/pom.xml'
      - '**/src/main/**'
      - 'proto-common/**'
      - '.github/workflows/ci-k8s.yml'

jobs:
  validate:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate overlays
        run: |
          cp k8s/overlays/local/secrets.env.example k8s/overlays/local/secrets.env
          for overlay in local prod; do
            echo "== $overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
          done

      # kubeconform checks each object alone, so it cannot see an object rendered into the
      # wrong namespace (an overlay's generated Secret once landed in "default").
      - name: Every object is in namespace petclinic
        run: |
          for overlay in local prod; do
            stray=$(kubectl kustomize "k8s/overlays/$overlay" \
              | yq ea 'select(.kind != "Namespace" and .metadata.namespace != "petclinic") | .kind + "/" + .metadata.name')
            if [ -n "$stray" ]; then
              echo "::error::$overlay renders objects outside namespace petclinic: $stray"
              exit 1
            fi
            echo "$overlay: ok"
          done

  e2e:
    name: deploy to kind + smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.27.0          # kindnet enforces NetworkPolicy since 0.24
          cluster_name: petclinic
          config: k8s/kind/cluster.yaml

      # On failure, kind-up.sh runs k8s/scripts/diagnose.sh itself (pods that are not Ready)
      - name: Build images and deploy
        run: k8s/scripts/kind-up.sh

      - name: Smoke test
        id: smoke
        run: k8s/scripts/smoke-test.sh

      # Every app pod's state and logs, also written as job annotations (readable without login)
      - name: Diagnostics
        if: failure() && steps.smoke.outcome == 'failure'
        run: k8s/scripts/diagnose.sh all
