name: CI — kubernetes

# validate: renders both kustomize overlays and checks every object against the Kubernetes
#           1.31 API schemas (typos, wrong fields, wrong types), in seconds.
# e2e:      builds the five images, deploys them to a throwaway kind cluster and runs
#           k8s/scripts/smoke-test.sh: gateway -> services -> gRPC/Kafka -> databases,
#           NetworkPolicy and the CronJob, i.e. the cross-service test the unit/integration
#           suites cannot do.
on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'k8s/**'
      - '**/Dockerfile'
      - '**/pom.xml'
      - '**/src/main/**'
      - 'proto-common/**'
      - '.github/workflows/ci-k8s.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'k8s/**'
      - '**/Dockerfile'
      - '**/pom.xml'
      - '**/src/main/**'
      - 'proto-common/**'
      - '.github/workflows/ci-k8s.yml'

jobs:
  validate:
    name: kustomize build + kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate overlays
        run: |
          cp k8s/overlays/local/secrets.env.example k8s/overlays/local/secrets.env
          for overlay in local prod; do
            echo "== $overlay"
            kubectl kustomize "k8s/overlays/$overlay" \
              | kubeconform -strict -summary -kubernetes-version 1.31.0
          done

  e2e:
    name: deploy to kind + smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.27.0          # kindnet enforces NetworkPolicy since 0.24
          cluster_name: petclinic
          config: k8s/kind/cluster.yaml

      - name: Build images and deploy
        run: k8s/scripts/kind-up.sh

      - name: Smoke test
        run: k8s/scripts/smoke-test.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n petclinic get all,pvc,networkpolicy,hpa,cronjob,job -o wide || true
          kubectl -n petclinic get events --sort-by=.lastTimestamp | tail -n 60 || true
          kubectl -n petclinic describe pods | tail -n 300 || true
          for w in deployment/api-gateway deployment/auth-service deployment/pet-service \
                   deployment/billing-service deployment/analytics-service \
                   statefulset/postgres statefulset/kafka; do
            echo "===== $w"
            kubectl -n petclinic logs "$w" --all-containers --tail=150 || true
          done
