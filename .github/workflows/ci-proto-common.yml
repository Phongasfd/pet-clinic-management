name: CI — proto-common

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'proto-common/**'
      - '.github/workflows/ci-proto-common.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'proto-common/**'
      - '.github/workflows/ci-proto-common.yml'

jobs:
  build:
    name: Build & Test proto-common
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & install to local Maven cache
        working-directory: proto-common
        run: mvn install -DskipTests -B

      - name: Upload proto-common artifact
        uses: actions/upload-artifact@v4
        with:
          name: proto-common-jar
          path: proto-common/target/*.jar
          retention-days: 1
