server:
  port: 8081
  # Kubernetes sends SIGTERM on every rollout and scale-in: stop taking new requests,
  # finish the in-flight ones, then exit (timeout set in k8s/base/config.yaml)
  shutdown: graceful

# /actuator/health/liveness and /actuator/health/readiness, used by the Kubernetes probes
# (k8s/base/apps/*.yaml). Only the health endpoint is exposed over HTTP, without details.
management:
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/petclinic_auth
    username: petclinic_user
    password: petclinic_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  # No default: must come from the environment (base64, >= 256 bit). A secret committed
  # to git lets anyone mint valid tokens. Generate one with: openssl rand -base64 32
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

app:
  # First admin account, created on startup when both are set (see AdminBootstrap)
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
