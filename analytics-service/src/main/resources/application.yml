server:
  port: 8084

spring:
  application:
    name: analytics-service

  # ----------------------------------------------------------------
  # Database — PostgreSQL
  # Trước đây dùng H2 in-memory: mỗi lần restart số liệu về 0 trong khi Kafka offset
  # vẫn được giữ, nên các event cũ không bao giờ được đếm lại → thống kê sai vĩnh viễn.
  # ----------------------------------------------------------------
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pet_clinic_analytics}
    username: ${DB_USERNAME:petclinic_user}
    password: ${DB_PASSWORD:petclinic_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update              # Tự động tạo/cập nhật bảng dựa theo Entity
    show-sql: false

  # ----------------------------------------------------------------
  # Kafka Consumer Configuration
  # Các cấu hình này được Spring Boot dùng để tự động tạo KafkaConsumerFactory
  # ----------------------------------------------------------------
  kafka:
    # Dùng chung cho consumer VÀ producer: DeadLetterPublishingRecoverer cần producer để
    # đẩy message lỗi sang pet-events.DLT (trước đây producer mặc định localhost:9092)
    bootstrap-servers: localhost:9092   # Địa chỉ Kafka broker (dùng 'kafka:9092' trong Docker)
    producer:
      # message gốc là byte[] (Protobuf); StringSerializer mặc định làm publish DLT thất bại
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: analytics-group           # Consumer group ID — mỗi group nhận đủ 1 bản copy message
      auto-offset-reset: earliest         # Đọc từ đầu topic nếu chưa có offset đã lưu (phù hợp cho dev)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer  # Protobuf dưới dạng bytes
      properties:
        spring.json.trusted.packages: "*"  # Cho phép deserialize từ mọi package (dùng nếu cần JSON fallback)

# ----------------------------------------------------------------
# Custom application properties
# ----------------------------------------------------------------
app:
  kafka:
    topics:
      pet-events: pet-events    # Tên Kafka topic để lắng nghe, tham chiếu qua @Value trong code
