server:
  port: 8084

spring:
  application:
    name: analytics-service

  # ----------------------------------------------------------------
  # Database — H2 In-Memory (dùng cho dev/demo, thay bằng PostgreSQL ở production)
  # H2 console có thể truy cập tại: http://localhost:8084/h2-console
  # ----------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:analyticsdb    # 'mem:' = tồn tại trong bộ nhớ RAM, mất khi restart
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console             # Đường dẫn UI quản lý H2 database

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update              # Tự động tạo/cập nhật bảng dựa theo Entity (chỉ dùng ở dev)
    show-sql: true                  # In câu SQL ra console để dễ debug

  # ----------------------------------------------------------------
  # Kafka Consumer Configuration
  # Các cấu hình này được Spring Boot dùng để tự động tạo KafkaConsumerFactory
  # ----------------------------------------------------------------
  kafka:
    consumer:
      bootstrap-servers: localhost:9092   # Địa chỉ Kafka broker (dùng 'kafka:9092' trong Docker)
      group-id: analytics-group           # Consumer group ID — mỗi group nhận đủ 1 bản copy message
      auto-offset-reset: earliest         # Đọc từ đầu topic nếu chưa có offset đã lưu (phù hợp cho dev)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer  # Protobuf dưới dạng bytes
      properties:
        spring.json.trusted.packages: "*"  # Cho phép deserialize từ mọi package (dùng nếu cần JSON fallback)

# ----------------------------------------------------------------
# Custom application properties
# ----------------------------------------------------------------
app:
  kafka:
    topics:
      pet-events: pet-events    # Tên Kafka topic để lắng nghe, tham chiếu qua @Value trong code
