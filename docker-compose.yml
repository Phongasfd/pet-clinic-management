version: '3.8'

services:
  # ================================================================
  # INFRASTRUCTURE
  # ================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: petclinic-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: petclinic_user
      POSTGRES_PASSWORD: petclinic_password
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petclinic-net

  # Kafka KRaft mode — không cần Zookeeper
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: petclinic-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - petclinic-net

  # ================================================================
  # APPLICATION SERVICES
  # ================================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "127.0.0.1:8081:8081" # only the gateway is public
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/petclinic_auth
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - petclinic-net

  pet-service:
    build:
      context: .   # repo root: the image also builds proto-common
      dockerfile: pet-service/Dockerfile
    container_name: pet-service
    ports:
      - "127.0.0.1:8082:8082" # trusts X-User-* headers: must sit behind the gateway
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pet_clinic_pets
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
      - GRPC_CLIENT_BILLING-SERVICE_ADDRESS=static://billing-service:9090
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP-SERVERS=kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - petclinic-net

  billing-service:
    build:
      context: .   # repo root: the image also builds proto-common
      dockerfile: billing-service/Dockerfile
    container_name: billing-service
    ports:
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pet_clinic_billing
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - petclinic-net

  analytics-service:
    build:
      context: .   # repo root: the image also builds proto-common
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pet_clinic_analytics
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
      # consumer AND the DLT producer
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - petclinic-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - PET_SERVICE_URL=http://pet-service:8082
      - ANALYTICS_SERVICE_URL=http://analytics-service:8084
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 32)}
    depends_on:
      - auth-service
      - pet-service
      - analytics-service
    networks:
      - petclinic-net

networks:
  petclinic-net:
    driver: bridge

volumes:
  postgres-data:
