version: '3.8'

services:
  # ================================================================
  # INFRASTRUCTURE
  # ================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: petclinic-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: petclinic_user
      POSTGRES_PASSWORD: petclinic_password
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - petclinic-net

  # Kafka KRaft mode — không cần Zookeeper
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: petclinic-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - petclinic-net

  # ================================================================
  # APPLICATION SERVICES
  # ================================================================
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/petclinic_auth
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - petclinic-net

  pet-service:
    build:
      context: ./pet-service
    container_name: pet-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pet_clinic_pets
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
      - GRPC_CLIENT_BILLING-SERVICE_ADDRESS=static://billing-service:9090
      - SPRING_KAFKA_PRODUCER_BOOTSTRAP-SERVERS=kafka:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - petclinic-net

  billing-service:
    build:
      context: ./billing-service
    container_name: billing-service
    ports:
      - "8083:8083"
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/pet_clinic_billing
      - SPRING_DATASOURCE_USERNAME=petclinic_user
      - SPRING_DATASOURCE_PASSWORD=petclinic_password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - petclinic-net

  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP-SERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - petclinic-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GATEWAY_ROUTES_0_URI=http://auth-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES_1_URI=http://pet-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES_2_URI=http://analytics-service:8084
    depends_on:
      - auth-service
      - pet-service
      - analytics-service
    networks:
      - petclinic-net

networks:
  petclinic-net:
    driver: bridge

volumes:
  postgres-data:
