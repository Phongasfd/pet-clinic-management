# A real cluster: images from a registry, two replicas of the request path, disruption
# budgets, an Ingress. Before applying, create the Secret yourself (it is never in git):
#   kubectl create namespace petclinic
#   kubectl -n petclinic create secret generic petclinic-secrets \
#     --from-literal=DB_USERNAME=... --from-literal=DB_PASSWORD=... \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#     --from-literal=BOOTSTRAP_ADMIN_USERNAME=admin --from-literal=BOOTSTRAP_ADMIN_PASSWORD=... \
#     --from-literal=ELASTIC_PASSWORD="$(openssl rand -hex 16)"
# (or let External Secrets / Sealed Secrets manage it). Then:
#   kubectl apply -k k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base's `namespace:` does not reach the Ingress and PDBs added here
namespace: petclinic

resources:
  - ../../base
  - ingress.yaml
  - pod-disruption-budgets.yaml

# Pin an immutable tag (the git SHA) in production, never :latest
images:
  - name: petclinic/api-gateway
    newName: ghcr.io/phongasfd/petclinic-api-gateway
    newTag: "0.1.0"
  - name: petclinic/auth-service
    newName: ghcr.io/phongasfd/petclinic-auth-service
    newTag: "0.1.0"
  - name: petclinic/pet-service
    newName: ghcr.io/phongasfd/petclinic-pet-service
    newTag: "0.1.0"
  - name: petclinic/billing-service
    newName: ghcr.io/phongasfd/petclinic-billing-service
    newTag: "0.1.0"
  - name: petclinic/analytics-service
    newName: ghcr.io/phongasfd/petclinic-analytics-service
    newTag: "0.1.0"
  - name: petclinic/search-service
    newName: ghcr.io/phongasfd/petclinic-search-service
    newTag: "0.1.0"

patches:
  # Elasticsearch with authentication (base relies on NetworkPolicy alone). Basic auth over
  # the cluster network; add TLS (or use the ECK operator) if the network is not trusted.
  # Strategic merge: env entries are merged by name, so these override base's values.
  - target:
      kind: StatefulSet
      name: elasticsearch
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: elasticsearch
      spec:
        template:
          spec:
            containers:
              - name: elasticsearch
                env:
                  - name: xpack.security.enabled
                    value: "true"
                  - name: xpack.security.http.ssl.enabled
                    value: "false"
                  - name: ELASTIC_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: petclinic-secrets
                        key: ELASTIC_PASSWORD
                  # real disks: keep the watermarks that protect the node from filling up
                  - name: cluster.routing.allocation.disk.threshold_enabled
                    value: "true"
                  - name: ES_JAVA_OPTS
                    value: -Xms1g -Xmx1g
                resources:
                  requests:
                    memory: 2Gi
                  limits:
                    memory: 2Gi
  - target:
      kind: Deployment
      name: search-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: search-service
      spec:
        template:
          spec:
            containers:
              - name: search-service
                env:
                  - name: SPRING_ELASTICSEARCH_USERNAME
                    value: elastic
                  - name: SPRING_ELASTICSEARCH_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: petclinic-secrets
                        key: ELASTIC_PASSWORD
  # Two pods minimum on the request path, so a node drain or a crash never takes it down
  - target:
      kind: HorizontalPodAutoscaler
      name: api-gateway|pet-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
  # Spread each Deployment's pods over different nodes when possible
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: api-gateway
  - target:
      kind: Deployment
      name: pet-service
    patch: |-
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: pet-service
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
