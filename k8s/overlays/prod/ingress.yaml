# Ingress: one HTTP(S) entry for the cluster, served by an ingress controller (here
# ingress-nginx). Only /api goes in, and only to the gateway; TLS ends at the controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic
  annotations:
    # with cert-manager installed, this issues and renews the certificate automatically
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.petclinic.example.com
      secretName: petclinic-tls
  rules:
    - host: api.petclinic.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
