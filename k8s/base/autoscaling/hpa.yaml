# HorizontalPodAutoscaler: adds or removes pods from CPU usage, measured against the pod's
# CPU *request* (100m). Needs metrics-server (minikube: `minikube addons enable metrics-server`;
# kind: see docs/kubernetes.md). Without it the HPA shows <unknown> and keeps minReplicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # a JVM burns CPU while it starts: wait a minute before reacting
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pet-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pet-service
  minReplicas: 1
  # Every replica runs its own OutboxRelay; FOR UPDATE SKIP LOCKED makes them share the
  # outbox table without sending a row twice.
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 1
  # = number of partitions of pet-events: more consumers than partitions would idle
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
