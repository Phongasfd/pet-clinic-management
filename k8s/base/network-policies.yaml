# NetworkPolicy: a firewall between pods, enforced by the CNI plugin (kindnet in kind 0.24+,
# Calico, Cilium...). By default every pod can reach every other pod in the cluster.
#
# Why this app needs it: pet-service trusts X-User-Id / X-User-Role because the gateway sets
# them. A ClusterIP Service is not reachable from outside the cluster, but ANY pod inside it
# (a compromised one, a debug pod) could call pet-service:8082 with "X-User-Role: ADMIN".
# Rule: deny all ingress, then open exactly the edges of the architecture diagram.
#
# Probes are not affected: the kubelet on the node is allowed by the CNI plugins in use.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}          # every pod in the namespace
  policyTypes: ["Ingress"] # no ingress rule listed => nothing allowed in
---
# Internet / ingress controller / NodePort -> api-gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-from-anywhere
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backends-from-gateway-only
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["auth-service", "pet-service", "analytics-service"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: 8081
        - port: 8082
        - port: 8084
---
# gRPC billing: only pet-service's outbox relay calls it
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: billing-from-pet-service-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pet-service
      ports:
        - port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["auth-service", "pet-service", "billing-service", "analytics-service", "outbox-maintenance"]
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-from-producers-and-consumers
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                # kafka itself: the broker connects to its own advertised address
                values: ["pet-service", "analytics-service", "kafka"]
      ports:
        - port: 9092
