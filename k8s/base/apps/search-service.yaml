# search-service: Kafka consumer of pet-events into Elasticsearch (+ the /search/pets API).
apiVersion: v1
kind: Service
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: search-service
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  labels:
    app.kubernetes.io/name: search-service
    app.kubernetes.io/component: backend
spec:
  # Replicas come from the HPA, capped at 3 like analytics-service: pet-events has 3 partitions.
  # Several pods are safe: each partition has one consumer, and external versioning makes a
  # write that loses a race (or is replayed after a rebalance) a no-op.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: search-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-service
        app.kubernetes.io/component: backend
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The index must exist before the listener starts (PetIndexManager also retries for 60s)
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 elasticsearch 9200; do echo waiting for elasticsearch; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 kafka 9092; do echo waiting for kafka; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: search-service
          image: petclinic/search-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: petclinic-config
          env:
            - name: SPRING_ELASTICSEARCH_URIS
              value: $(ELASTICSEARCH_URIS)
            # consumer AND the DLT producer (see docker-compose.yml)
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: $(KAFKA_BOOTSTRAP_SERVERS)
            # must match pet-service's topic, or the index silently stops updating
            - name: APP_KAFKA_TOPICS_PET-EVENTS
              value: $(KAFKA_TOPIC_PET_EVENTS)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
