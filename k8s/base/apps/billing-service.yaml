# billing-service: gRPC server on 9090, called only by pet-service's outbox relay.
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    # Only gRPC is published. The HTTP port (8083) serves nothing but the probes.
    # Note: gRPC keeps one long-lived HTTP/2 connection, so a ClusterIP Service balances
    # connections, not calls. With several replicas you would use a headless Service and
    # client-side round_robin (see docs/kubernetes.md).
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: backend
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 postgres 5432; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: billing-service
          image: petclinic/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: petclinic-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/pet_clinic_billing
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: petclinic-secrets
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petclinic-secrets
                  key: DB_PASSWORD
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Native gRPC probe (Kubernetes 1.27+): the kubelet calls grpc.health.v1.Health/Check,
          # which grpc-spring-boot-starter registers. Ready means the gRPC server itself answers,
          # which is what pet-service depends on.
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
