server:
  port: 8083

grpc:
  server:
    port: 9090

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pet_clinic_billing
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
