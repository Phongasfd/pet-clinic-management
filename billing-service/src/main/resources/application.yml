server:
  port: 8083
  # Kubernetes sends SIGTERM on every rollout and scale-in: stop taking new requests,
  # finish the in-flight ones, then exit (timeout set in k8s/base/config.yaml)
  shutdown: graceful

# /actuator/health/liveness and /actuator/health/readiness, used by the Kubernetes probes
# (k8s/base/apps/*.yaml). Only the health endpoint is exposed over HTTP, without details.
management:
  endpoint:
    health:
      probes:
        enabled: true

grpc:
  server:
    port: 9090

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pet_clinic_billing
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
