spring:
  application:
    name: pet-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petclinic}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST_LOCAL:localhost}:${DB_PORT_LOCAL:5432}/${DB_NAME_LOCAL:petclinic_local}
    username: ${DB_USERNAME_LOCAL:postgres}
    password: ${DB_PASSWORD_LOCAL:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
