version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pet_clinic_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pet_clinic_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pet_clinic_pgdata:
